<!doctype html>
<html data-theme="glass">
<head>
<meta charset="UTF-8">
<style>
:root {
  /* spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* radii */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;

  /* motion */
  --transition: 0.2s ease;

  /* typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* entity colours — shared across every report */
  --entity-topic: #2196F3;
  --entity-repo: #9C27B0;
  --entity-website: #FF9800;
  --entity-person: #F44336;

  /* light theme (video report default) */
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #333333;
  --text-secondary: #666666;
  --border-color: #dddddd;
  --link-color: #0066cc;
  --accent-color: #4CAF50;
}
[data-theme="glass"] {
  --bg-primary: #0a0a0f;
  --bg-secondary: #14141f;
  --bg-tertiary: #1a1a2e;
  --text-primary: #e4e4e7;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --accent-primary: #a855f7;
  --accent-secondary: #ec4899;
  --accent-tertiary: #06b6d4;
  --success: #10b981;
  --warning: #f59e0b;
  --border: #27272a;
  --glass-bg: rgba(20, 20, 31, 0.6);
  --glass-border: rgba(255, 255, 255, 0.1);
}

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: -50%; width: 200%; height: 200%; z-index: -1;
      background: radial-gradient(circle at 20% 50%, rgba(168,85,247,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(236,72,153,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 40% 20%, rgba(6,182,212,0.1) 0%, transparent 50%); }

    .videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }
    .video-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; position: relative; }
    .video-card:hover { transform: translateY(-8px); border-color: var(--accent-primary); box-shadow: 0 20px 60px rgba(168,85,247,0.2); }
    .video-thumbnail-wrapper { position: relative; padding-top: 56.25%; background: var(--bg-tertiary); overflow: hidden; }
    .video-thumbnail { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .video-card:hover .video-thumbnail { transform: scale(1.05); }
    .video-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,15,0.9) 0%, transparent 60%); }
    .video-content { padding: 24px; }
    .video-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video-meta { display: flex; gap: 12px; color: var(--text-muted); font-size: 0.875rem; margin-bottom: 12px; flex-wrap: wrap; }
    .video-summary { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .video-topics { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .topic-tag { padding: 6px 14px; background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.3); border-radius: 20px; font-size: 0.8rem; color: var(--accent-primary); font-weight: 500; }
    .video-actions { display: flex; gap: 12px; align-items: center; }
    .btn { padding: 10px 20px; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; flex: 1; text-align: center; }
    .btn-primary:hover { box-shadow: 0 8px 24px rgba(168,85,247,0.4); transform: translateY(-2px); }
    .btn-danger { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 10px 16px; }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }
    .checkbox-wrapper { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent-primary); }
</style>
</head>
<body style="padding:32px">
<div class="videos-grid" style="grid-template-columns:minmax(380px,420px)"><div class="video-card" data-id="kCc8FmEb1nY" data-title="Let&#x27;s build GPT: from scratch, in code, spelled out." data-topics="Transformers,GPT,Attention,PyTorch,">
    <div class="video-thumbnail-wrapper">
        <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%229%22%3E%3Crect%20width%3D%2216%22%20height%3D%229%22%20fill%3D%22%231a1a2e%22%2F%3E%3C%2Fsvg%3E" alt="Let&#x27;s build GPT: from scratch, in code, spelled out." class="video-thumbnail">
        <div class="video-overlay"></div>

    <div class="video-content">

        </div>
        <div class="video-actions">
            <a href="https://www.youtube.com/watch?v=kCc8FmEb1nY" target="_blank" class="btn btn-primary">Watch</a>
            <button class="btn btn-danger" onclick="confirmRemove('kCc8FmEb1nY', 'video')">Remove</button>
            <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox" onchange="toggleResearched('kCc8FmEb1nY', 'video')" data-id="kCc8FmEb1nY">

    </div>
</div></div>
</body>
</html>
