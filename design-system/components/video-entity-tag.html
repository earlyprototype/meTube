<!-- @dsCard group="Video Report" -->
<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root {
  /* spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* radii */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;

  /* motion */
  --transition: 0.2s ease;

  /* typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* entity colours — shared across every report */
  --entity-topic: #2196F3;
  --entity-repo: #9C27B0;
  --entity-website: #FF9800;
  --entity-person: #F44336;

  /* light theme (video report default) */
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #333333;
  --text-secondary: #666666;
  --border-color: #dddddd;
  --link-color: #0066cc;
  --accent-color: #4CAF50;
}

    * { box-sizing: border-box; }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); line-height: 1.6; }

    .entity-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
    .entity-tag { padding: 6px 12px; background: var(--accent-color); color: white; border-radius: 16px; font-size: 13px; text-decoration: none; transition: opacity 0.2s; }
    .entity-tag:hover { opacity: 0.8; }
    .entity-tag.topic { background: var(--entity-topic); }
    .entity-tag.repo { background: var(--entity-repo); }
    .entity-tag.website { background: var(--entity-website); }
    .entity-tag.person { background: var(--entity-person); }
</style>
</head>
<body style="padding:32px">
<div class="entity-list">
      <span class="entity-tag topic">Transformers</span>
      <span class="entity-tag person">Andrej Karpathy</span>
      <span class="entity-tag">Neural Networks</span>
    </div>
</body>
</html>
