<!-- @dsCard group="Playlist Report" -->
<!doctype html>
<html data-theme="glass">
<head>
<meta charset="UTF-8">
<style>
:root {
  /* spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* radii */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;

  /* motion */
  --transition: 0.2s ease;

  /* typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* entity colours — shared across every report */
  --entity-topic: #2196F3;
  --entity-repo: #9C27B0;
  --entity-website: #FF9800;
  --entity-person: #F44336;

  /* light theme (video report default) */
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #333333;
  --text-secondary: #666666;
  --border-color: #dddddd;
  --link-color: #0066cc;
  --accent-color: #4CAF50;
}
[data-theme="glass"] {
  --bg-primary: #0a0a0f;
  --bg-secondary: #14141f;
  --bg-tertiary: #1a1a2e;
  --text-primary: #e4e4e7;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --accent-primary: #a855f7;
  --accent-secondary: #ec4899;
  --accent-tertiary: #06b6d4;
  --success: #10b981;
  --warning: #f59e0b;
  --border: #27272a;
  --glass-bg: rgba(20, 20, 31, 0.6);
  --glass-border: rgba(255, 255, 255, 0.1);
}

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: -50%; width: 200%; height: 200%; z-index: -1;
      background: radial-gradient(circle at 20% 50%, rgba(168,85,247,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(236,72,153,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 40% 20%, rgba(6,182,212,0.1) 0%, transparent 50%); }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .stat-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 24px; transition: transform 0.2s, border-color 0.2s; }
    .stat-card:hover { transform: translateY(-4px); border-color: var(--accent-primary); }
    .stat-value { font-size: 2.5rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
</style>
</head>
<body style="padding:32px">
<div class="stats-bar">
      <div class="stat-card">
          <div class="stat-value">24</div>
          <div class="stat-label">Videos</div>
      </div>      <div class="stat-card">
          <div class="stat-value">18</div>
          <div class="stat-label">Repos</div>
      </div>      <div class="stat-card">
          <div class="stat-value">92%</div>
          <div class="stat-label">Transcribed</div>
      </div>    </div>
</body>
</html>
