<!-- @dsCard group="Video Report" -->
<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root {
  /* spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* radii */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;

  /* motion */
  --transition: 0.2s ease;

  /* typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* entity colours — shared across every report */
  --entity-topic: #2196F3;
  --entity-repo: #9C27B0;
  --entity-website: #FF9800;
  --entity-person: #F44336;

  /* light theme (video report default) */
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #333333;
  --text-secondary: #666666;
  --border-color: #dddddd;
  --link-color: #0066cc;
  --accent-color: #4CAF50;
}

    * { box-sizing: border-box; }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); line-height: 1.6; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 0; }
    .stat-box { background: var(--bg-primary); padding: 15px; border-radius: 4px; text-align: center; border: 1px solid var(--border-color); }
    .stat-number { font-size: 28px; font-weight: bold; color: var(--accent-color); }
    .stat-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; margin-top: 5px; }
</style>
</head>
<body style="padding:32px">
<div class="stats-grid">
      <div class="stat-box">
          <div class="stat-number">1,234,567</div>
          <div class="stat-label">Views</div>
      </div>
      <div class="stat-box">
          <div class="stat-number">48,200</div>
          <div class="stat-label">Likes</div>
      </div>
      <div class="stat-box">
          <div class="stat-number">3,910</div>
          <div class="stat-label">Comments</div>
      </div>
    </div>
</body>
</html>
