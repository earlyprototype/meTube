<!-- @dsCard group="Playlist Report" -->
<!doctype html>
<html data-theme="glass">
<head>
<meta charset="UTF-8">
<style>
:root {
  /* spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* radii */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;

  /* motion */
  --transition: 0.2s ease;

  /* typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* entity colours — shared across every report */
  --entity-topic: #2196F3;
  --entity-repo: #9C27B0;
  --entity-website: #FF9800;
  --entity-person: #F44336;

  /* light theme (video report default) */
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #333333;
  --text-secondary: #666666;
  --border-color: #dddddd;
  --link-color: #0066cc;
  --accent-color: #4CAF50;
}
[data-theme="glass"] {
  --bg-primary: #0a0a0f;
  --bg-secondary: #14141f;
  --bg-tertiary: #1a1a2e;
  --text-primary: #e4e4e7;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --accent-primary: #a855f7;
  --accent-secondary: #ec4899;
  --accent-tertiary: #06b6d4;
  --success: #10b981;
  --warning: #f59e0b;
  --border: #27272a;
  --glass-bg: rgba(20, 20, 31, 0.6);
  --glass-border: rgba(255, 255, 255, 0.1);
}

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: -50%; width: 200%; height: 200%; z-index: -1;
      background: radial-gradient(circle at 20% 50%, rgba(168,85,247,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(236,72,153,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 40% 20%, rgba(6,182,212,0.1) 0%, transparent 50%); }

    .repo-grid { display: grid; gap: 20px; }
    .repo-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 32px; transition: transform 0.3s, border-color 0.3s; position: relative; }
    .repo-card:hover { transform: translateX(8px); border-color: var(--success); }
    .repo-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .repo-name { font-size: 1.4rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .repo-name a { color: var(--success); text-decoration: none; transition: color 0.3s; }
    .repo-name a:hover { color: var(--accent-tertiary); }
    .repo-description { color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; font-size: 1rem; }
    .repo-stats { display: flex; gap: 20px; margin-bottom: 16px; color: var(--text-muted); font-size: 0.9rem; }
    .repo-videos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .video-mention { padding: 6px 12px; background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.2); border-radius: 8px; font-size: 0.85rem; color: var(--text-secondary); transition: all 0.3s; cursor: pointer; }
    .video-mention:hover { background: rgba(168,85,247,0.2); border-color: var(--accent-primary); color: var(--text-primary); }
    .checkbox-wrapper { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent-primary); }
</style>
</head>
<body style="padding:32px">
<div class="repo-card" data-id="https://github.com/karpathy/nanoGPT" data-name="karpathy/nanoGPT">
    <div class="repo-header">
        <div class="repo-name">
            <a href="https://github.com/karpathy/nanoGPT" target="_blank">karpathy/nanoGPT</a>
        </div>
        <label class="checkbox-wrapper">
            <input type="checkbox" class="checkbox" onchange="toggleResearched('https://github.com/karpathy/nanoGPT', 'repo')" data-id="https://github.com/karpathy/nanoGPT">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Reviewed</span>
        </label>
    </div>
    <div class="repo-description">The simplest, fastest repository for training/finetuning medium-sized GPTs.</div>
    <div class="repo-stats">
        <span>Mentioned in 3 video(s)</span>
    </div>
    <div class="repo-videos">
        <div class="video-mention" title="Building makemore">
            Video 1
        </div>
        <div class="video-mention" title="Let&#x27;s build GPT">
            Video 2
        </div>
        <div class="video-mention" title="GPT tokenizer">
            Video 3
        </div>
    </div>
</div>
</body>
</html>
