<!-- @dsCard group="Playlist Report" -->
<!doctype html>
<html data-theme="glass">
<head>
<meta charset="UTF-8">
<style>
:root {
  /* spacing scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* radii */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;

  /* motion */
  --transition: 0.2s ease;

  /* typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* entity colours — shared across every report */
  --entity-topic: #2196F3;
  --entity-repo: #9C27B0;
  --entity-website: #FF9800;
  --entity-person: #F44336;

  /* light theme (video report default) */
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #333333;
  --text-secondary: #666666;
  --border-color: #dddddd;
  --link-color: #0066cc;
  --accent-color: #4CAF50;
}
[data-theme="glass"] {
  --bg-primary: #0a0a0f;
  --bg-secondary: #14141f;
  --bg-tertiary: #1a1a2e;
  --text-primary: #e4e4e7;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --accent-primary: #a855f7;
  --accent-secondary: #ec4899;
  --accent-tertiary: #06b6d4;
  --success: #10b981;
  --warning: #f59e0b;
  --border: #27272a;
  --glass-bg: rgba(20, 20, 31, 0.6);
  --glass-border: rgba(255, 255, 255, 0.1);
}

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
    body::before { content: ''; position: fixed; inset: -50%; width: 200%; height: 200%; z-index: -1;
      background: radial-gradient(circle at 20% 50%, rgba(168,85,247,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(236,72,153,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 40% 20%, rgba(6,182,212,0.1) 0%, transparent 50%); }

    .video-topics { display: flex; flex-wrap: wrap; gap: 8px; }
    .topic-tag { padding: 6px 14px; background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.3); border-radius: 20px; font-size: 0.8rem; color: var(--accent-primary); font-weight: 500; }
</style>
</head>
<body style="padding:32px">
<div class="video-topics">
      <span class="topic-tag">Transformers</span><span class="topic-tag">Reinforcement Learning</span><span class="topic-tag">Backpropagation</span><span class="topic-tag">Tokenization</span>
    </div>
</body>
</html>
