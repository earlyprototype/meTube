name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (rebuild lockfile so optional platform deps install)
        # The committed lockfile is generated on Windows and drops the
        # Linux-specific Rollup native binary (@rollup/rollup-linux-x64-gnu),
        # which vitest needs to start. Regenerate the lockfile fresh on Linux
        # so npm pulls the right optional binary for this runner.
        run: |
          rm -f package-lock.json
          npm install --include=optional

      - run: npm run build

      - run: npm test
