name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (rebuild lockfile for target platform)
        # The committed lockfile is generated on Windows and lacks the
        # Linux-specific Rollup native binary (@rollup/rollup-linux-x64-gnu),
        # which vitest needs to start. npm ci is strict and won't fetch
        # optional deps absent from the lockfile, so we drop it and let npm
        # resolve fresh for ubuntu-latest.
        run: |
          rm -f package-lock.json
          npm install --include=optional --ignore-scripts
          npm rebuild

      - run: npm run build

      - run: npm test
