name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The committed lockfile is generated on Windows and omits the
      # platform-specific Rollup native binary CI needs
      # (@rollup/rollup-linux-x64-gnu). npm ci refuses to fetch optional
      # deps missing from the lockfile (npm/cli#4828), so drop it and let
      # npm resolve fresh for ubuntu-latest each run.
      - name: Install (workaround npm/cli#4828)
        run: rm -f package-lock.json && npm install --include=optional

      - run: npm run build

      - run: npm test
